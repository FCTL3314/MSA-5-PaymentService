# Прототип OrchestrPay: стек Camunda 8 (Zeebe + Operate + Tasklist) и сервис оркестрации платежа.
# Запуск: docker compose up -d --build
#   Operate:  http://localhost:8080/operate   (demo / demo)
#   Tasklist: http://localhost:8080/tasklist  (demo / demo)
#   API сервиса: http://localhost:8000/docs
name: orchestrpay

services:
  postgres:
    image: postgres:17
    container_name: orchestrpay-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='payments'\" | grep -q 1"]
      interval: 2s
      retries: 30
    networks: [orchestrpay]

  redis:
    image: redis:alpine
    container_name: orchestrpay-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30
    networks: [orchestrpay]

  # Orchestration Cluster Camunda 8.9: Zeebe (движок BPMN) + Operate + Tasklist + REST API v2 в одном образе.
  # Вторичное хранилище (данные для Operate/Tasklist) — PostgreSQL, без Elasticsearch.
  orchestration:
    image: camunda/camunda:8.9.28
    container_name: orchestrpay-camunda
    ports:
      - "8080:8080"   # REST API, Operate, Tasklist
      - "9600:9600"   # management / health
    mem_limit: 1536m
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    volumes:
      - camunda-data:/usr/local/camunda/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3 | grep -q 200'"]
      interval: 3s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [orchestrpay]

  # Наш сервис: деплоит BPMN и форму в Camunda при старте, запускает job workers и REST API платежей.
  payment-service:
    build: ./payment-service
    image: orchestrpay/payment-service:1.0
    container_name: orchestrpay-payment-service
    ports:
      - "8000:8000"
    environment:
      CAMUNDA_REST_URL: http://orchestration:8080/v2
      DATABASE_URL: postgresql://payments:payments@postgres:5432/payments
      REDIS_URL: redis://redis:6379/0
      WORKER_NAME: payment-service
      FRAUD_CHECK_CUT_OFF: PT3S
      MANUAL_REVIEW_TIMEOUT: PT20M
    depends_on:
      orchestration:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [orchestrpay]

volumes:
  postgres-data:
  camunda-data:

networks:
  orchestrpay:
    name: orchestrpay

configs:
  orchestration-config:
    file: ./camunda/application.yaml
